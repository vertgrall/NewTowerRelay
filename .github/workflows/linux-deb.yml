name: Linux .deb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev dpkg-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libasound2-dev

      - name: Build and package
        run: ./scripts/build-release.sh

      - name: Verify .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DEB="dist/ntrelay_${VERSION}_amd64.deb"
          test -f "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb -c "$DEB" | head -20
          ar t "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: ntreelay-linux-deb
          path: |
            dist/ntrelay_*_amd64.deb
            dist/NewTowerRelay-*-Linux-x86_64
