[package]
name = "new_tower_relay"
version = "0.1.0"
edition = "2021"
description = "Cross-platform encrypted LAN file sharing"
rust-version = "1.75"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
hostname = "0.4"
if-addrs = "0.13"
mdns-sd = "0.13"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
